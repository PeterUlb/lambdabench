# Versions for the Java Lambda artifacts. smithy-java is consumed from Maven
# Central (the .tmp/smithy-java clone is reference only). smithyGradleVersion
# matches the Rust/Node smithy projects; smithyVersion is the Smithy release
# smithy-java itself is built against (1.7.0 -> 1.73.0): with 1.74.0 the codegen
# run fails with a NoSuchMethodError on UnstableTrait.getFeatureId.
smithyJavaVersion=1.7.0
smithyVersion=1.73.0
smithyGradleVersion=1.5.0

org.gradle.parallel=true
org.gradle.caching=true
