[package]
name = "oneoff-rust-sdk-init"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# One-off probe behind the Rust `aws_config::load()` table in
# site/src/lifecycle.md ("same work, different phase"). Not part of the
# benchmark matrix; see README.md here for how to run it.

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
aws-config = "1"
aws-credential-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
