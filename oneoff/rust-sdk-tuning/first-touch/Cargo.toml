[package]
name = "oneoff-rust-first-touch"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Crypto first-use micro-probe behind the page-cache finding on
# site/src/tuning.md; see ../README.md.

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
aws-lc-rs = "=1.18.1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "ring", "std", "tls12", "prefer-post-quantum"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

# Standalone, like the parent probe.
[workspace]

[profile.lambda]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
