[package]
name = "oneoff-init-timeout"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Rust version of the init sleep and hang in ../fn/index.mjs, for the init-timeout probe (see
# ../README.md). Not part of the benchmark matrix.

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
lambda_runtime = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
